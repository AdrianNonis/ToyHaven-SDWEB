<!DOCTYPE html>
<!--
  WISHLIST / COLLECTION PAGE - wishlist.html
  Purpose: Shows products saved by the user and allows each product to be marked as
  Interested, Owned or Not Interested.
-->
<html lang="en">
<head>
  <!-- Basic page setup. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Toy Haven online toy shop">

  <title>Toy Haven | Wishlist</title>

  <!-- Shared website files. -->
  <link rel="icon" href="icons/icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Shared header and navigation. -->
  <header class="header">
    <a class="logo" href="index.html">TOY HAVEN</a>
    <button id="menuBtn" class="menu-btn" aria-label="Open menu">☰</button>

    <nav id="nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="wishlist.html">Wishlist</a>
      <a href="cart.html">Cart (<span id="cartCount">0</span>)</a>
      <a href="support.html">Support</a>
    </nav>
  </header>

  <main class="section">
    <h1>My Wishlist / Collection</h1>
    <p>Save products and change their collection status.</p>

    <!--
      WISHLIST FILTER
      JavaScript uses this dropdown to show All, Interested, Owned or Not Interested items.
    -->
    <div class="controls">
      <select id="wishlistFilter">
        <option>All</option>
        <option>Interested</option>
        <option>Owned</option>
        <option>Not Interested</option>
      </select>
    </div>

    <!-- JavaScript creates the saved wishlist product cards inside this grid. -->
    <div id="wishlistGrid" class="product-grid"></div>

    <!-- Message appears here if the selected wishlist section is empty. -->
    <p id="wishlistEmpty" class="message"></p>
  </main>

  <!-- Shared footer. -->
  <footer>
    <p>© 2026 Toy Haven</p>

    <div>
      <a href="index.html">Home</a> |
      <a href="products.html">Products</a> |
      <a href="support.html">Support</a>
    </div>

    <form id="newsletterForm">
      <label for="newsletterEmail">Newsletter</label>
      <input id="newsletterEmail" type="email" placeholder="Enter your email" required>
      <button type="submit">Subscribe</button>
    </form>

    <p id="newsletterMessage"></p>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
