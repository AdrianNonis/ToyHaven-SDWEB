<!DOCTYPE html>
<!--
  CHECKOUT PAGE - checkout.html
  Purpose: Collects customer details, shows the order summary, validates the form,
  saves the order and clears the cart after a successful checkout.
-->
<html lang="en">
<head>
  <!-- Basic browser and responsive settings. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Toy Haven online toy shop">

  <title>Toy Haven | Checkout</title>

  <!-- Favicon, PWA settings and website design. -->
  <link rel="icon" href="icons/icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Shared site header and navigation. -->
  <header class="header">
    <a class="logo" href="index.html">TOY HAVEN</a>
    <button id="menuBtn" class="menu-btn" aria-label="Open menu">☰</button>

    <nav id="nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="wishlist.html">Wishlist</a>
      <a href="cart.html">Cart (<span id="cartCount">0</span>)</a>
      <a href="support.html">Support</a>
    </nav>
  </header>

  <main class="section">
    <h1>Checkout</h1>

    <!-- Two-column checkout layout: form on the left, order summary on the right. -->
    <div class="checkout-layout">
      <!--
        CUSTOMER DETAILS FORM
        JavaScript checks each field when Confirm Order is pressed.
        Error messages are written in the small elements under each field.
      -->
      <form id="checkoutForm" class="form-box">
        <label for="fullName">Full Name</label>
        <input id="fullName" type="text">
        <small id="nameError"></small>

        <label for="email">Email</label>
        <input id="email" type="email">
        <small id="emailError"></small>

        <label for="address">Delivery Address</label>
        <textarea id="address" rows="4"></textarea>
        <small id="addressError"></small>

        <label for="payment">Payment Method</label>
        <select id="payment">
          <option value="">Choose payment</option>
          <option>Card</option>
          <option>Cash on Delivery</option>
        </select>
        <small id="paymentError"></small>

        <!-- Submitting this button triggers the JavaScript checkout validation. -->
        <button class="button" type="submit">Confirm Order</button>
      </form>

      <!--
        ORDER SUMMARY
        JavaScript reads the saved cart and writes each product and the final total here.
      -->
      <aside class="summary">
        <h2>Order Summary</h2>
        <div id="checkoutItems"></div>
        <p class="total">Final Total: $<span id="checkoutTotal">0.00</span></p>
      </aside>
    </div>

    <!-- JavaScript writes the successful order message here. -->
    <div id="successBox" class="success"></div>
  </main>

  <!-- Shared footer and newsletter. -->
  <footer>
    <p>© 2026 Toy Haven</p>

    <div>
      <a href="index.html">Home</a> |
      <a href="products.html">Products</a> |
      <a href="support.html">Support</a>
    </div>

    <form id="newsletterForm">
      <label for="newsletterEmail">Newsletter</label>
      <input id="newsletterEmail" type="email" placeholder="Enter your email" required>
      <button type="submit">Subscribe</button>
    </form>

    <p id="newsletterMessage"></p>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
